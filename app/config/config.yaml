# config.yaml

ollama_models:
  default: "gemma3:27b-cloud" # default model is used in ollama_api.py
  llama: "llama2:latest" # 7b
  mistral: "mistral-large-3:675b-cloud" # "mistral:latest" # 7b
  qwen: "qwen3-next:80b-cloud" # qwen3:8b
  gpt-oss: "gpt-oss:20b-cloud" # gpt-oss:20b 
  deepseek: "deepseek-v3.2:cloud" # deepseek-r1:8b
  glm: "glm-4.7:cloud" 
  gemini: "gemini-3-flash-preview:cloud"
  gemma: "gemma3:27b-cloud" # gemma3:12b (sparse)
  deepseek-coder: "deepseek-coder-v2:16b" # MoE (comparable to GPT4-turbo for coding specific tasks)
  nemotron: "nemotron-3-nano:30b-cloud" # MoE very fast
  cogito: "cogito-2.1:671b-cloud"
  # gemma-quantized: "gemma3:27b-it-qat" # instruction-tuned, quantized, not responding
  

model:
  name: "gemini-2.5-flash-lite"

embedding_model:
  name: "gemini-embedding-001"

embed_cost_per_1k_tokens: 0.00015

use_drift: False  # False: no drift, True: drift

sim_config:
  persona: "Hailey Johnson"    # get the names from driftville_personas.json file
  start_time: "2023-02-13 10:00"   # keep it at quarters of an hour
  num_ticks: 65   # keep it at 2 for this example, as the simulation is very short

load_prompt_from_langfuse: True   # False: loading the prompt from the local .yaml file, True: loading the prompt from LangFuse

temperature: 1.0
